name: 🐞 Bug Report
description: Report an issue or unexpected folding behavior in Class Fold
title: "[Bug]: "
labels: ["🐞 bug", "🚥 status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: |
        Attribute does not fold / does not unfold on cursor / hover preview card issue...
    validations:
      required: true

  - type: dropdown
    id: syntax-type
    attributes:
      label: Attribute / Syntax Type
      description: What type of attribute or syntax is causing the issue?
      multiple: true
      options:
        - HTML class attribute (class="...")
        - JSX className (className="...")
        - JSX Template Literal (className={`...`})
        - Vue bound class (:class="..." or v-bind:class)
        - Tailwind directive (tw="...")
        - Utility wrapper (clsx, cn, cva, twMerge)
        - SVG Path / Points (d="..." or points="...")
        - Base64 Image Data URI
        - Image URL (src="..." or srcset="...")
        - Custom User Regex
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction-snippet
    attributes:
      label: Code Snippet
      description: Provide the line or snippet of markup where the issue occurs.
      placeholder: |
        <div class="flex items-center justify-between p-6 bg-white rounded-2xl shadow-xl">
        /* or */
        <span className={`text-sm font-semibold text-slate-700`}>Title</span>
      render: html
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps To Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open file '...'
        2. Move cursor inside the attribute / press Alt+Z
        3. Folding does not toggle / unfolds unexpectedly
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Video
      description: Attach screenshots or screen recordings if visual context helps explain the problem.
      placeholder: Drag and drop images here.
    validations:
      required: false

  - type: input
    id: vscode-version
    attributes:
      label: VS Code Version
      description: What version of VS Code are you using? (Help -> About)
      placeholder: e.g. 1.95.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running?
      options:
        - Windows 11 / 10
        - macOS (Apple Silicon M-series)
        - macOS (Intel)
        - Linux (Ubuntu / Debian / Fedora)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Developer Tools Console Logs
      description: Open Help -> Toggle Developer Tools -> Console, and paste any error logs here.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have checked the existing [issues](https://github.com/chouhan-rahul/class-fold/issues) to avoid duplicates.
          required: true
        - label: I have read the [Contributing Guidelines](https://github.com/chouhan-rahul/class-fold/blob/main/CONTRIBUTING.md).
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/chouhan-rahul/class-fold/blob/main/CODE_OF_CONDUCT.md).
          required: true
